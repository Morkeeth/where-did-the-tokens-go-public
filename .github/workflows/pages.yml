name: Synthetic demo and packages
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build and test
        run: |
          python3 -m pip install 'setuptools>=77' wheel
          python3 -m unittest discover -s tests
          python3 tools/build_release.py release
          python3 tools/audit_release.py release --history
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: release/static-demo
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy synthetic site
        id: deployment
        uses: actions/deploy-pages@v4
