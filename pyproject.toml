[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-token-inventory"
version = "0.1.0"
description = "A consent-first local dashboard for coding-agent usage counters"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
token-inventory = "tokens.inventory:main"
token-inventory-agent = "tokens.agent:main"

[tool.setuptools]
packages = ["tokens"]
include-package-data = false

[tool.setuptools.package-data]
tokens = ["web/*.html", "skills/local-token-inventory/SKILL.md"]
